name: Bug report
description: Something in reflect isn't working as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security vulnerabilities, do **not** use this form; see `SECURITY.md`.
  - type: input
    id: version
    attributes:
      label: reflect version
      description: Output of `reflect --version` (or `npx @chanjoongx/reflect --version`)
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      placeholder: "e.g. 2.1.325"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include exact error messages and the output of `reflect status` if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`reflect doctor` output"
      description: Run it in the project where the problem happens.
      render: shell
  - type: textarea
    id: events
    attributes:
      label: "Relevant lines from .reflect/sessions/<session>/events.jsonl"
      description: |
        The "skip" and "error" lines usually explain a silent hook. These lines can contain your
        messages (already redacted for keys, emails and home paths); remove anything else private.
      render: json
