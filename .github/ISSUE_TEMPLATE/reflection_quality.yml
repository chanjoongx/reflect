name: Reflection quality issue
description: A reflection was generic, wrong, or counterproductive, or reflect missed or misread your pushback.
title: "[rq] "
labels: ["reflection-quality"]
body:
  - type: markdown
    attributes:
      value: |
        Reflection quality issues are the highest-leverage feedback for reflect. The more concrete the report, the faster the prompt improves.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of issue
      options:
        - Generic (no actionable adjustment)
        - Wrong pattern identification
        - Missed obvious signal
        - False trigger (an ordinary instruction judged as pushback)
        - Missed pushback (you corrected the agent and nothing was judged as pushback)
        - Hallucinated context not in prompt
        - Other
    validations:
      required: true
  - type: textarea
    id: trigger-context
    attributes:
      label: Trigger context (1-2 sentences)
      description: What were you doing when the reflection fired?
      placeholder: "Refactoring src/billing/kyc.ts. I told it twice to keep the magic number where it was."
    validations:
      required: true
  - type: textarea
    id: reflection-output
    attributes:
      label: Reflection output (verbatim)
      description: Paste from `.reflect/session-guidance.md` or terminal log.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected-reflection
    attributes:
      label: What the reflection should have said
      description: Hand-crafted "good" version. This becomes a calibration example.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: redacted-prompt
    attributes:
      label: The verdict and fire lines (redacted)
      description: |
        The "verdict", "fire" and "guidance" lines from `.reflect/sessions/<session>/events.jsonl`.
        They hold your messages (already redacted for keys, emails and home paths); remove anything else private.
        Optional, but it lets us reproduce the call.
      render: json
