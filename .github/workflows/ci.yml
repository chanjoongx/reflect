name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    steps:
      # .gitattributes converts nothing (the plugin directory requires that),
      # so keep Windows from checking files out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Typecheck and unit tests (no API calls; the model is faked)
        run: npm test
      - name: plugin/hooks/reflect.ts matches src/ and passes the plugin rules
        run: npm run check:bundle
      - name: The npm command runs under plain node, as hand-wired hooks run it
        run: npm run smoke
      - name: src/redact.ts matches the viewer's copy
        if: runner.os == 'Linux'
        run: npm run mirror-check
      - name: The npm tarball installs and runs on its own
        if: runner.os == 'Linux'
        run: |
          WANT=$(node -p "require('./package.json').version")
          # prepack builds dist/ and prints a line, so the file name is the last line.
          TARBALL="$PWD/$(npm pack --silent | tail -n 1)"
          test -f "$TARBALL"
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL" >/dev/null
          test "$(npx reflect --version)" = "$WANT"
          echo '{"session_id":"ci","prompt":"hi"}' | npx reflect prompt
